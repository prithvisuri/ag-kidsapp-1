name: ag-kidsapp
on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: install nodejs
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: install dependencies
        run: npm install
      - name: run build
        run: npm run build
      - name: run tests and coverage
        run: npm run coverage
      
      - name: SonarCloud Scan # --- SonarCloud Analysis Steps ---
        uses: sonarsource/sonarqube-scan-action@v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SonarCloud Quality Gate Check #Optional: Uncomment if you want to fail the pipeline when the Quality Gate fails
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: dist/
  
  docker: # --- Docker Build and Push Steps ---
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: get code
        uses: actions/checkout@v7

      - name: download build artifact
        uses: actions/download-artifact@v4
        with:
          name: production-files
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ag-kidsapp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ag-kidsapp:${{ github.run_number }}
