name: ag-kidsapp
on: workflow_dispatch
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v7
      - name: install nodejs
        uses: [GitHub Actions setup-node](https://github.com/actions/setup-node)@v7
        with:
          node-version: '22' # Changed from '26' to a valid LTS version
      - name: install dependencies
        run: npm install 
      - name: run build
        run: npm run build # Fixed "mpn build" typo and added "run"
      - name: mpm tests
        run: npm test # Fixed "mpn test" typo

          
     
    
