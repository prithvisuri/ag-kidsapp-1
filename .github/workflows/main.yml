name: ag-kidsapp
on: workflow_dispatch
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v7
      - name: install nodejs
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: install dependencies
        run: npm install 
      - name: run tests
        run: mpn test
        
          
     
    
